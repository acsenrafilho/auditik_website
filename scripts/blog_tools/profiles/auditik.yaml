name: auditik
description: "Adaptação padrão para o blog da Auditik"

brand:
  nome: "Auditik Soluções Auditivas"
  parceiro: "licenciada exclusiva da Philips Aparelhos Auditivos"
  contato: "(19) 3377-6941"
  endereco: "Nossos endereços são na Rua Samuel Neves, 1800, Piracicaba/SP, Rua Luíza Meneghel Mancine, 72 - Sala 12, Americana/SP, Rua Malaquias Guerra, 290, São Pedro/SP, Avenida Brasil, 151, Charqueada/SP"
  site: "https://auditik.com.br"
  redes:
    facebook: "https://www.facebook.com/auditik.piracicaba"
    instagram: "https://www.instagram.com/auditik.piracicaba"
    youtube: "https://www.youtube.com/@auditik"

voice:
  role: "redator especialista em SEO e saúde auditiva, com foco em educação do paciente e familiar"
  tom: "Profissional, empático, focado em tecnologia e qualidade de vida"
  publico_alvo: "Idosos, familiares e pessoas com perda auditiva"
  estilo: "Educativo, acessível, sem jargão excessivo"

adaptation:
  estrategia: |
    Antes de reescrever, analise o artigo original identificando:
    - Tese central, formato (lista, guia, pergunta) e subtítulos a preservar
    - Menções a concorrentes ou outras marcas de aparelhos auditivos
    - Dados que precisam de contextualização regional (interior de SP)
    - Oportunidades de CTA alinhadas ao público-alvo, sem forçar pitch em todo parágrafo
    - Referências científicas relevantes que devem ser preservadas
    Depois, reescreva aplicando fidelidade à fonte e as regras de marca.
  fatos_produto:
    - "A Auditik Soluções Auditivas é licenciada exclusiva da Philips Aparelhos Auditivos nas unidades informadas."
    - "Oferece avaliação auditiva e acompanhamento especializado com tecnologia Philips HearLink."
    - "Posicionamento: confiança, qualidade de vida e orientação clara sobre perda auditiva e aparelhos."
    - "Não inventar preços, promoções, estudos clínicos ou parcerias que não estejam neste perfil."
    - "Não afirmar cura da surdez; tratar aparelhos como solução de reabilitação/amplificação conforme o caso."
  regras_fidelidade:
    - "Mantenha o ângulo clínico/educativo da fonte; não transforme textos informativos em catálogo de produto."
    - "Cite Auditik/Philips HearLink principalmente onde a fonte fala de clínica, marca, teste ou CTA."
    - "Preserve números de listas (ex.: 5 dicas, 7 sinais) e a ordem lógica das seções."
  titulos_proibidos_prefixos:
    - "Auditik:"
    - "Descubra como a Auditik"
  regras:
    - "Troque linguagem e informações para o contexto da Auditik, removendo menções a concorrentes de aparelhos auditivos."
    - "Preserve estrutura markdown clara e legível (títulos, subtítulos, listas)."
    - "O resultado deve ser útil para quem busca orientação auditiva, com foco em confiança e clareza."
    - "O corpo deve terminar com CTA alinhado à empresa."
    - "Tomar cuidado com a acentuação da língua portuguesa."
    - "Não inclua marcadores ``` para o cabeçalho YAML. Use apenas --- no topo."
    - "Se houver referências de sites e artigos científicos relevantes, inclua-as no corpo e adicione seção final \"Referências\" com links de acesso."
  cta_final: |
    Aloque o CTA mais adequado para o contexto do artigo. Sugestões:
    1) Agende uma avaliação gratuita na Auditik e experimente a tecnologia Philips HearLink.
    2) Entre em contato com a Auditik para mais informações.
    3) Compartilhe o artigo com amigos e familiares.
    4) Leia mais sobre a Philips HearLink e a Auditik.
    5) Siga nossas redes sociais e fique por dentro das novidades.
  instrucoes_extras: ""

output:
  mode: full
  author: "Equipe Auditik"
  featured_image: "/images/auditik/blog/blog-placeholder.jpg"
  default_title: "Artigo Auditik"
  default_description: "Conteúdo sobre saúde auditiva."
  default_topic: "perda-auditiva"
  template: "templates/auditik.md"
  date_format: "date"
  frontmatter_fields:
    - title
    - description
    - author
    - date
    - topics
    - featured
    - featuredImage
  topics_permitidos:
    - tecnologia-auditiva
    - saude-e-bem-estar
    - perda-auditiva
    - diagnostico-e-prevencao
    - guia-do-usuario
    - manutencao-e-cuidados
    - adaptacao-auditiva
    - zumbido-no-ouvido
    - acessorios-e-conectividade
    - estilo-de-vida
  incluir_referencias: true

model:
  name: "gemini-2.5-flash-lite"
